version: 2
# THREE ecosystems, where the reference project needs only the first: this
# repository has a pyproject.toml and a package.json as well as pinned action
# SHAs. Each gets one grouped PR per week rather than one per dependency.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-majors:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-majors:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: npm
    directory: "/src/yt_shorts/studio/web"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    groups:
      # Majors ride alone. One weekly PR bundling twelve packages of which
      # three were majors (#7) cost a full review to work out which of them
      # could break what.
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      frontend-majors:
        patterns: ["*"]
        update-types: ["major"]
