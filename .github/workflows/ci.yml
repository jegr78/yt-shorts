name: CI

# The test gate. Seven jobs, deliberately NOT a cross product: the Python axis
# (3.12/3.13/3.14) runs on ubuntu only, while the OS axis runs on the pinned
# ship version (3.13) alone — macOS and Windows runners are the slow, scarce
# ones and they catch path/process bugs, not version drift.
#
# NB: the job names below ("lint", "frontend", "test (<os>, <ver>)",
# "binary-smoke") are the ruleset's required status checks. Renaming one does
# not fail a PR — it DEADLOCKS it, waiting on a check that can never report.
# Change a name here and update the ruleset in the same breath.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    # ruff AND tools/lint.py. The second is not redundant: it carries three
    # in-house guards ruff has no rule for (a silently swallowed except, a
    # procedure whose return value is used, and a hardcoded home directory in
    # ANY tracked file — this repository is public), and its ruff pass includes
    # F811 — the only thing that catches a duplicate test-class name, which
    # pytest drops SILENTLY while reporting a smaller number that looks healthy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
        with:
          version: "0.15.16"   # pinned: a new ruff rule must not break CI silently
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: In-house AST guards
        run: python3 tools/lint.py

  frontend:
    # Builds the studio SPA and hands it to every other job as an artifact.
    # studio/static/ is NOT committed: it is built here once rather than five
    # times, so the test legs all get the same bundle and none of them needs
    # Node. hatch_build.py does the same for a wheel built outside CI.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/yt_shorts/studio/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "26.4.0"
          cache: npm
          cache-dependency-path: src/yt_shorts/studio/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build          # tsc -b && vite build
      - name: Hand the built SPA to the other jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: studio-static
          path: src/yt_shorts/studio/static/
          retention-days: 1
          if-no-files-found: error

  test:
    # needs frontend: studio/static/ is not committed, and 116 E2E tests plus
    # test_studio_static need the built page. One build, five consumers.
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
        # exclude, not include: it keeps the job names shaped
        # "test (<os>, <ver>)", which is what the ruleset matches on.
        exclude:
          - {os: macos-latest, python-version: "3.12"}
          - {os: macos-latest, python-version: "3.14"}
          - {os: windows-latest, python-version: "3.12"}
          - {os: windows-latest, python-version: "3.14"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Take the studio SPA from the frontend job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: studio-static
          path: src/yt_shorts/studio/static/

      # ffmpeg is a REAL dependency of the suite, measured: 61 tests fail
      # without it (tests/test_trim.py::TestWithRealFfmpeg is named for it).
      # yt-dlp is NOT — the suite passes 2544/2544 with it stubbed out — so it
      # is deliberately absent here. Native package managers rather than a
      # third-party action: one fewer thing in the supply chain that can run
      # with this job's token.
      # Ubuntu ships ffmpeg 6, which times the concat demuxer's repeated final
      # frame differently (issue #4). Pinned static build, checksum-verified,
      # same major version this project is developed against.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        env:
          FFMPEG_TAG: autobuild-2026-08-05-15-18
          FFMPEG_FILE: ffmpeg-n8.1.2-34-g9b6c8969e0-linux64-gpl-8.1.tar.xz
          FFMPEG_SHA256: 5c907fde14d64d402d6e806cd307266f88899931cabcc81c99e1720b9fd28797
        run: |
          curl -fsSL -o /tmp/ffmpeg.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_TAG}/${FFMPEG_FILE}"
          echo "${FFMPEG_SHA256}  /tmp/ffmpeg.tar.xz" | sha256sum -c -
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
          sudo install -m755 "/tmp/${FFMPEG_FILE%.tar.xz}/bin/ffmpeg" /usr/local/bin/ffmpeg
          sudo install -m755 "/tmp/${FFMPEG_FILE%.tar.xz}/bin/ffprobe" /usr/local/bin/ffprobe
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Prove ffmpeg is really there
        run: ffmpeg -version

      - name: Install the package and its test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"

      # Two tests decode for real; without this they fetch ~460 MB per leg.
      - name: Cache the Whisper model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: whisper-small-${{ runner.os }}-v1

      # Chromium on ONE leg only. Everywhere else the E2E suite skips itself
      # (tests/test_studio_e2e.py::_chromium_available), which is exactly what
      # makes this matrix affordable.
      - name: Install Chromium for the E2E suite
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python -m playwright install --with-deps chromium

      - name: Run the suite
        env:
          HF_HOME: ${{ github.workspace }}/.hf-cache
        run: |
          set -o pipefail
          python -m pytest -q -rs | tee /tmp/suite.log

      # THE GUARD. If `playwright install` fails, the E2E tests skip and the
      # run above still goes green — a smaller number that looks healthy. So on
      # the one leg that installs a browser, nothing may skip; test_transcribe
      # is the one exemption (an unreachable model Hub). Reads the run above
      # rather than re-running the E2E file: that cost 109s, measured.
      - name: The E2E suite must actually run, not skip
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          unexpected=$(grep '^SKIPPED' /tmp/suite.log \
                       | grep -v '^SKIPPED \[[0-9]*\] tests/test_transcribe.py:' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Tests SKIPPED on the browser leg. Chromium is missing, and the E2E suite just vanished from a green run."
            echo "$unexpected"
            exit 1
          fi

  binary-smoke:
    needs: frontend
    # CI must exercise everything release.yml exercises, so a PR that breaks
    # the binary goes red here rather than at the v* tag. ffmpeg AND yt-dlp are
    # installed first, on purpose: the smoke test runs `install-tools`, which
    # INSTALLS what is missing even with no flags. With both present it probes
    # and returns early instead of running a package manager mid-build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Take the studio SPA from the frontend job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: studio-static
          path: src/yt_shorts/studio/static/
      - name: Install ffmpeg and yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install yt-dlp
      - name: Install the package and PyInstaller
        run: |
          python -m pip install -e ".[all]"
          python -m pip install pyinstaller
      - name: Build the binary and smoke-test it
        run: python tools/build-binary.py --version ci-smoke
