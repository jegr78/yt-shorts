name: CodeQL

# Static security analysis (free for public repositories). BOTH languages: the
# reference project this is modelled on has no frontend, but this repository
# ships a React studio, and its TypeScript is as much a part of the attack
# surface as the Python.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"  # weekly catch-all, independent of pushes

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # required to upload CodeQL results
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Excludes the minified production JS bundle from the
          # javascript-typescript leg - git-ignored, so it matches nothing in
          # CI and everything in a developer's built tree. See
          # .github/codeql/codeql-config.yml for the measurement and the
          # reasoning.
          config-file: ./.github/codeql/codeql-config.yml
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
