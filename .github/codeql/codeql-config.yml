name: "YT-Shorts CodeQL config"

# Excludes only the committed, minified JS bundle - its alerts are unfixable by
# definition (you fix the source under web/src/ and rebuild). Everything else,
# including tests/, is scanned. No query-filters on purpose: a finding that is
# not a defect gets dismissed individually, with a reason.
paths-ignore:
  - src/yt_shorts/studio/static
