[pytest]
# Silence two benign third-party deprecation warnings so the run summary stays
# clean; anything NEW still surfaces (we filter by message, not blanket-ignore).
#   - Pillow's Image.getdata (used by the overlay/preview pixel-count tests)
#   - Starlette's TestClient-over-httpx notice (from fastapi.testclient)
# Remove a line here if you migrate the underlying call instead of muting it.
filterwarnings =
    ignore:Image.Image.getdata is deprecated
    ignore:Using `httpx` with `starlette.testclient` is deprecated
